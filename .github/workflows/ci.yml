name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: macos-26
    env: { TWINFOLD_QUIET_SECONDS: "0" }
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - run: scripts/e2e.sh
      - run: python3 -I scripts/mcp-e2e.py
      - run: python3 -I scripts/safety-e2e.py
      - run: scripts/app-e2e.sh
